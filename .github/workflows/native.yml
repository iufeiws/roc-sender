name: Native build

# Builds roc.dll and its runtime DLLs on Windows and publishes them, together
# with the public C headers of the pinned Roc revision, as a release asset.
on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned sources and toolchain
        shell: pwsh
        run: ./setup.ps1 -NativeOnly

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          cmake --version
          ninja --version

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          $stage = 'dist/roc-windows-x64'
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/include", "$stage/licenses" | Out-Null
          Copy-Item build/Release/roc.dll, build/Release/libc++.dll, build/Release/libunwind.dll "$stage/bin"
          Copy-Item -Recurse vendor/roc-toolkit/src/public_api/include/roc "$stage/include"
          Copy-Item licenses/* "$stage/licenses"
          git -C vendor/roc-toolkit rev-parse HEAD | Set-Content -NoNewline "$stage/ROC_REVISION"
          Compress-Archive -Path "$stage/*" -DestinationPath dist/roc-windows-x64.zip
          (Get-FileHash dist/roc-windows-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline dist/roc-windows-x64.zip.sha256
          Get-Content dist/roc-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: roc-windows-x64
          path: dist/roc-windows-x64.zip*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/roc-windows-x64.zip dist/roc-windows-x64.zip.sha256 --title $env:GITHUB_REF_NAME --notes "roc.dll built by the Native build workflow."
